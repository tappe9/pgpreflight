[package]
name = "pgpreflight-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Conservative PostgreSQL validation, planning, and normalization for pgpreflight"
homepage.workspace = true
documentation = "https://docs.rs/pgpreflight-postgres"
readme = "README.md"
keywords = ["postgresql", "sql", "explain", "database"]
categories = ["database", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[lib]
path = "src/lib.rs"

[dependencies]
pgpreflight-core = { path = "../pgpreflight-core", version = "0.1.0" }
serde_json = { workspace = true }
sqlparser = { version = "0.62", default-features = false, features = ["std", "visitor"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
