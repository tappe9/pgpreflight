[workspace]
members = [
  "crates/pgpreflight-core",
  "crates/pgpreflight-postgres",
  "crates/pgpreflight",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tappe9/pgpreflight"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
