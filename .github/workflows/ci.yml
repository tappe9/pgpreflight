name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo +1.85.0 check --workspace --all-targets --all-features

  cross-platform:
    name: cross-platform / non-db (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo +stable build --workspace --all-targets --all-features
      - run: cargo +stable test --workspace --all-features

  postgresql:
    name: postgresql / ${{ matrix.postgresql }}
    strategy:
      fail-fast: false
      matrix:
        postgresql:
          - 14
          - 15
          - 16
          - 17
          - 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgpreflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgpreflight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPREFLIGHT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pgpreflight
      PGPREFLIGHT_TEST_POSTGRES_MAJOR: ${{ matrix.postgresql }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo +1.85.0 test --workspace --all-features

  release-readiness:
    name: release-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Verify locked workspace metadata
        run: cargo +stable metadata --locked --format-version 1 --no-deps
      - name: Verify publish packages in dependency order
        run: |
          cargo +stable publish --dry-run --locked -p pgpreflight-core
          cargo +stable package --locked --no-verify -p pgpreflight-postgres \
            --config 'patch.crates-io.pgpreflight-core.path="crates/pgpreflight-core"'
          cargo +stable package --locked --no-verify -p pgpreflight \
            --config 'patch.crates-io.pgpreflight-core.path="crates/pgpreflight-core"' \
            --config 'patch.crates-io.pgpreflight-postgres.path="crates/pgpreflight-postgres"'
      - name: Run release-readiness contract tests
        run: python3 -m unittest discover -s scripts/tests -v

  required:
    name: required
    if: ${{ always() }}
    needs:
      - quality
      - msrv
      - cross-platform
      - postgresql
      - release-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.msrv.result }}" = "success"
          test "${{ needs.cross-platform.result }}" = "success"
          test "${{ needs.postgresql.result }}" = "success"
          test "${{ needs.release-readiness.result }}" = "success"
